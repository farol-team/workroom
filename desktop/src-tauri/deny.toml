# What we accept from the supply chain of a crate that embeds a browser engine.
#
# Checked in CI rather than trusted: an advisory against a transitive dependency
# is not something anybody notices by reading a lockfile.

[advisories]
version = 2
# A yanked crate is a maintainer saying "do not use this". Warn rather than fail:
# it is often yanked for reasons that do not affect us, and a hard failure here
# blocks unrelated work on somebody else's decision.
yanked = "warn"

[licences]
version = 2
# Permissive, plus the two weak-copyleft licences that appear in the graph of
# anything using webkit. Anything outside this list is a decision somebody makes
# deliberately, not one a `cargo update` makes for them.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0",
  "BSL-1.0", "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"   # unavoidable in this graph, and not a risk on its own
wildcards = "deny"            # a wildcard version is an update nobody reviewed

[sources]
unknown-registry = "deny"
unknown-git = "deny"
