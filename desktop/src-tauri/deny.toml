# What we accept from the supply chain of a crate that embeds a browser engine.
#
# Checked in CI rather than trusted: an advisory against a transitive dependency
# is not something anybody notices by reading a lockfile.

[advisories]
version = 2

# The first run found sixteen advisories and **zero vulnerabilities**: ten from
# the GTK3 bindings the Linux webview stands on, five from `unic-*`, one from a
# build-time macro crate. Every one is transitive and none is ours to replace —
# short of not shipping a desktop application at all.
#
# So the unmaintained check applies to what we chose. An unmaintained crate we
# added is a decision to revisit; an unmaintained crate Tauri needs is a fact
# about the platform, and failing on it every day teaches people to pass
# `--ignore` until the day it means something.
#
# A vulnerability still fails, anywhere in the graph. That is the line.
unmaintained = "workspace"

# A yanked crate is a maintainer saying "do not use this". Warn rather than fail:
# it is often yanked for reasons that do not affect us, and a hard failure blocks
# unrelated work on somebody else's decision.
yanked = "warn"

[licenses]
version = 2
# Permissive, plus the weak-copyleft ones that appear in the graph of anything
# using webkit. Outside this list is a decision somebody makes deliberately, not
# one a `cargo update` makes for them.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0",
  "BSL-1.0", "OpenSSL", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# This crate is an application, not something published to a registry. It has no
# licence field and does not need one; saying so here is better than inventing a
# licence to satisfy a checker.
private = { ignore = true }

[bans]
multiple-versions = "allow"   # unavoidable in this graph, and not a risk on its own
wildcards = "deny"            # a wildcard version is an update nobody reviewed

[sources]
unknown-registry = "deny"
unknown-git = "deny"
