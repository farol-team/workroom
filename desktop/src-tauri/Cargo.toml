[package]
name = "workroom-desktop"
version = "0.1.0"
# An application, not a library. Saying so is what lets the licence check skip a
# crate that has no licence field and does not need one.
publish = false
description = "WorkRoom desktop client"
authors = ["Farol Labs"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "workroom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The folder a person binds a channel to is chosen with their own file dialog,
# never typed — a path typed wrong is a session that works in the wrong place.
tauri-plugin-dialog = "2"
# Updates are signed and verified against a key compiled into the app. Without
# that this is a remote code execution feature with a friendly name.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros"] }

