<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkRoom</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside>
        <header>
          <strong>WorkRoom</strong>
          <span id="who" class="muted"></span>
        </header>
        <nav id="channels"></nav>
        <footer>
          <button id="agent-toggle">Start agent</button>
          <span id="agent-status" class="muted">off</span>
        </footer>
      </aside>

      <main>
        <header>
          <div><strong id="channel-name">—</strong> <span id="channel-purpose" class="muted"></span></div>
          <button id="memory-toggle" class="ghost">What the room knows</button>
        </header>
        <section id="messages"></section>
        <form id="composer">
          <button type="button" id="summon" class="ghost" title="Address your agent">@agent</button>
          <input id="input" placeholder="Message the room…" autocomplete="off" />
          <span id="destination" class="muted">&rarr; the room</span>
          <button type="submit">Send</button>
        </form>
      </main>

      <aside id="memory" hidden>
        <header><strong>Memory</strong><span id="memory-uri" class="muted"></span></header>
        <div id="memory-list"></div>
      </aside>
    </div>

    <dialog id="signin">
      <form method="dialog">
        <h2>Sign in</h2>
        <p class="muted">Development sign-in. Any email works; try alice@farol.run.</p>
        <input id="email" value="alice@farol.run" />
        <button value="ok">Enter</button>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
