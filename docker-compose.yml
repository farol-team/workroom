# Postgres for local development. Everything else runs on the host.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workroom
      POSTGRES_PASSWORD: workroom
      POSTGRES_DB: workroom_development
    ports: ["5433:5432"]
    volumes: ["workroom-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The context database. Optional: without it the memory store is PostgreSQL.
  # It computes abstracts and embeddings, so it needs a model provider of its
  # own — infrastructure inference, which Article P2 permits server-side and
  # permits for nothing else.
  openviking:
    image: python:3.12-slim
    profiles: ["memory"]
    command: >
      sh -c "pip install --no-cache-dir openviking==0.4.11 'mcp<2' &&
             openviking-server --host 0.0.0.0 --port 1933"
    environment:
      OPENVIKING_CONFIG_FILE: /etc/openviking/ov.conf
    ports: ["1933:1933"]
    volumes:
      - ./ov.conf:/etc/openviking/ov.conf:ro
      - workroom-ov:/work
    working_dir: /work

volumes:
  workroom-pg:
  workroom-ov:
