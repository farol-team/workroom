# Deploying WorkRoom.
#
#   bin/kamal setup     # first time: installs docker on the host, boots the proxy
#   bin/kamal deploy    # every time after
#
# Everything below that is not filled in is a decision somebody has to make, not
# a default worth guessing. See docs/DEPLOYING.md.

service: workroom

# Yandex Container Registry addresses images as cr.yandex/<registry-id>/<name>.
image: crpgjk8bi1k5adp4g05l/workroom

servers:
  web:
    - 51.250.10.118

proxy:
  # Served over plain HTTP by address while workroom.farol.team still points
  # elsewhere. A certificate cannot be issued for a name that does not resolve
  # here, so `ssl` and `host` wait for the DNS record. See docs/DEPLOYING.md.
  ssl: false
  # The client holds a long-lived websocket per open channel. Without this the
  # proxy closes it after a minute and the room stops being live for anybody
  # who is reading rather than typing.
  healthcheck:
    path: /up
    interval: 5
  app_port: 80

# The image lives in the cloud's own registry, and the password is an IAM token
# that expires — fetched at deploy time, never stored.
#
# Port 22 is unreachable from the environment this is deployed from, so the
# server runs sshd on 2222 as well; the machine's first boot configures it.
ssh:
  user: yc-user
  port: 2222

registry:
  server: cr.yandex
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    # No SOLID_QUEUE_IN_PUMA. Since #55 the agent distils its own memory and
    # nothing in this application enqueues anything, so starting a worker only
    # gave Puma a supervisor that queries tables no schema defines — which took
    # the whole server down on boot. When something needs a queue again, it
    # arrives with its own database and schema; see test/config/queue_config_test.rb.
    RAILS_ENV: production
    STORAGE_REGION: ru-central1
    # Reached by address, with no certificate to redirect to. This comes out the
    # moment `proxy.ssl` goes back on above — the two belong together.
    WORKROOM_INSECURE_HTTP: true
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    # `*` is right for a desktop client on a laptop and wrong the moment this is
    # reachable from a browser. The application refuses to boot without it.
    - WORKROOM_ALLOWED_ORIGINS
    # Identity. Without an issuer the workspace says plainly that it has no way
    # to sign in, rather than falling back to something that takes any address.
    - OIDC_ISSUER
    - OIDC_CLIENT_ID
    - OIDC_CLIENT_SECRET
    - OIDC_REDIRECT_URI
    # Work product belongs to the channel, so it must not live on a disk that a
    # deploy replaces.
    - STORAGE_ENDPOINT
    - STORAGE_BUCKET
    - STORAGE_ACCESS_KEY_ID
    - STORAGE_SECRET_ACCESS_KEY
    # The context database, when one is configured. Without it memory is
    # PostgreSQL, which works and retrieves by substring rather than by meaning.
    - OPENVIKING_URL
    - OPENVIKING_API_KEY

# The database is a managed cluster that already exists and is shared with other
# applications. It is not an accessory here: nothing in this file may create,
# migrate or destroy it, and `kamal setup` must not be able to take it down.
#
# The context database is the opposite case: nothing else uses it, it holds only
# what this workspace put there, and it is rebuilt rather than recovered.
accessories:
  context:
    image: cr.yandex/crpgjk8bi1k5adp4g05l/openviking:0.4.11
    host: 51.250.10.118
    # Deliberately no `port`. Publishing one would put a store that answers to a
    # single API key on the open internet; on the container network it is
    # reachable by the application and by nothing else.
    files:
      - config/ov.conf.erb:/config/ov.conf
    directories:
      - data:/data
    env:
      clear:
        OPENVIKING_CONFIG_FILE: /config/ov.conf

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
  shell: app exec --interactive --reuse "bash"

# One machine, one container. When that stops being enough, the thing to add is
# a second server here — not a queue process, and not a second database.
builder:
  arch: amd64
