default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV.fetch("DATABASE_URL", "postgres://workroom:workroom@127.0.0.1:5433") %>

development:
  primary:
    <<: *default
    database: workroom_development
  cable:
    <<: *default
    database: workroom_development_cable
    # No app migrations here — the cable database is defined by db/cable_schema.rb.
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: workroom_test

production:
  primary:
    <<: *default
    database: workroom_production
  cable:
    <<: *default
    database: workroom_production_cable
    # No app migrations here — the cable database is defined by db/cable_schema.rb.
    migrations_paths: db/cable_migrate
