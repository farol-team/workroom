name: memory-contract

# The live half of the store contract (#123). `open_viking_test.rb` skips every
# case unless a real OpenViking answers, so `server-ci` proves the contract
# against PostgreSQL and asserts nothing about the store production uses —
# which is how #1, #47 and #99 each shipped. This runs those cases against the
# real thing, with no credential: the models come from Ollama on the runner
# (the setup RUNNING.md documents for a laptop), so nothing spendable lives in
# CI.
#
# Nightly and on demand, never in the required checks: the model pulls and the
# contract's own retrieval polls put it in a different budget class from the
# two-minute `server-ci`.
on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      # The models by content, not by network: ~3 GB that only changes when the
      # model names below do.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ~/.ollama/models
          key: ollama-nomic-embed-text-qwen3-4b

      - name: Ollama, and the two models the store reads with
        working-directory: .
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

          # Ollama must listen on every interface, not on loopback: the store
          # reads the models from inside a container and arrives over the docker
          # bridge, where a 127.0.0.1 listener refuses the connection. Bound to
          # loopback the models are not slow, they are absent — and absence is
          # silent here, because `search` returns nothing rather than raising.
          # That is the whole of #123's nightly hour: eight retrieval cases,
          # each spending the full OPENVIKING_PATIENCE to discover it.
          #
          # The installer's own service is not a thing to configure, because it
          # is not reliably a thing at all: this runner image said "systemd is
          # not running" on the nightly of 2026-08-14 and started the unit
          # normally that same evening. So whatever it started is stopped, and
          # the Ollama this job uses is the one started here — same bind, same
          # user, same model directory as the cache key above, on both images.
          sudo systemctl stop ollama 2>/dev/null || true
          sudo pkill -x ollama 2>/dev/null || true
          for i in $(seq 1 30); do ss -tln | grep -q ':11434 ' || break; sleep 1; done

          (OLLAMA_HOST=0.0.0.0:11434 ollama serve >/tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434 >/dev/null && break; sleep 1; done
          # The log is kept rather than sent to /dev/null, and the bind address
          # is asserted rather than assumed: answering on loopback proves only
          # that some Ollama is up, which is exactly the reading that let a
          # refused container connection look like a healthy job for eleven
          # nightlies.
          ss -tln | grep -qE '(0\.0\.0\.0|\*):11434 ' || {
            echo "Ollama is not listening on every interface:"; ss -tln | grep 11434
            cat /tmp/ollama.log; exit 1;
          }
          ollama pull nomic-embed-text
          ollama pull qwen3:4b

      - name: The store, from the pinned image
        working-directory: .
        run: |
          cp ov.conf.ollama.example ov.conf
          docker compose --profile memory up -d --build openviking
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:1933 && break
            sleep 2
          done

      # Asserted from inside the store's own container, over the hop the store
      # actually uses. The reachability this pins is what #123's first eleven
      # nightlies lacked: unreachable models cost an hour of timeouts and read
      # as flaky retrieval, so the one thing worth learning in ten seconds is
      # whether the store can see them at all. No curl in python:3.12-slim.
      - name: The models, from where the store sits
        working-directory: .
        run: |
          docker compose --profile memory exec -T openviking python -c '
          import sys, urllib.request
          try:
              urllib.request.urlopen("http://host.docker.internal:11434/api/tags", timeout=10)
          except Exception as error:
              sys.exit(f"the store cannot reach Ollama on the host: {error}")
          '

      # One account per run: created here, dropped at the end. Per-case
      # accounts are forty create-and-poll round trips; the cross-case leak
      # this suite exists to catch needs a real store at all, not a fresh
      # account per assertion.
      - name: An account of this run's own
        id: account
        working-directory: .
        run: |
          for i in $(seq 1 10); do
            RESPONSE=$(curl -s -X POST http://127.0.0.1:1933/api/v1/admin/accounts \
              -H "X-API-Key: change-me" -H "Content-Type: application/json" \
              -d "{\"account_id\":\"ci-${GITHUB_RUN_ID}\",\"admin_user_id\":\"ci\"}") && \
              [ -n "$RESPONSE" ] && break
            sleep 3
          done
          echo "store answered: $RESPONSE"
          KEY=$(printf '%s' "$RESPONSE" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          def find(node):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k in ("user_key", "api_key", "key") and isinstance(v, str): return v
                      found = find(v)
                      if found: return found
              if isinstance(node, list):
                  for v in node:
                      found = find(v)
                      if found: return found
          print(find(body) or "")')
          [ -n "$KEY" ] || { echo "no key in the store answer" >&2; exit 1; }
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          working-directory: server
          bundler-cache: false

      - run: bundle install --jobs 4

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Boundary
        run: bin/rails db:boundary

      # Both variables on this step and only this step: with OPENVIKING_URL in
      # the job's env, db:prepare booted against the store with no key and the
      # seed died on a 401 before the contract ever ran (first dispatch).
      - name: The contract, against the store production actually uses
        env:
          OPENVIKING_URL: http://127.0.0.1:1933
          OPENVIKING_API_KEY: ${{ steps.account.outputs.key }}
          # qwen3:4b on a two-core runner summarizes in minutes, not seconds.
          # The second dispatch proved every retrieval failure was this and
          # nothing else: 118 runs, and every miss a poll that gave up first.
          OPENVIKING_PATIENCE: "420"
        run: bin/rails test test/services/memory/

      - name: Drop the run's account
        if: always()
        working-directory: .
        run: |
          curl -s -X DELETE "http://127.0.0.1:1933/api/v1/admin/accounts/ci-${GITHUB_RUN_ID}" \
            -H "X-API-Key: change-me" || true
          docker compose --profile memory down -v || true
