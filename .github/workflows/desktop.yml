name: desktop

# Unfiltered trigger, filtered work — see the note in server.yml. The filtering
# now happens in the `changes` job so that `desktop-ci` always reports.
on:
  push:
    branches: [main]
    # The release path: a desktop-v* tag is what cuts signed bundles and the
    # updater manifest. Without this line the `bundle` condition below could
    # never be true (#172).
    tags: ['desktop-v*']
  pull_request:
  # Full cross-platform bundles are expensive; build them on demand and on tags.
  # On demand still means against a tag: the release must not be cut against a
  # branch name.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing desktop-v* tag to cut the release against"
        required: true
        type: string

# Read-only by default; a job that must write says so itself. See
# CONTRIBUTING.md for the pinning rule the `uses:` lines follow.
permissions:
  contents: read

jobs:
  changes:
    # A tag has no base to diff against, and the release does not depend on
    # this filter; ci runs happened when the tagged commit reached main.
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            desktop:
              - 'desktop/**'
              - '.github/workflows/desktop.yml'

  check:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The agent adapter is a dependency now rather than something fetched from
      # the internet when a person opens a channel. That is only worth anything
      # if the registry's signatures are checked rather than admired.
      - name: Signatures
        run: pnpm audit signatures

      # The agent the demo runs on, started and asked. Not compared against the
      # committed table: `authMethods` reflects whether the machine running it
      # is logged in, and a runner never is. What this asserts is that it still
      # starts and still speaks the protocol (#111).
      - name: Agent bench
        run: pnpm bench:capabilities

      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build frontend
        run: pnpm build

  # The bridge to the agent is the part everything else depends on, so it is
  # compiled on every change rather than only when a bundle is cut.
  bridge:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential libssl-dev

      # No node here. The bundle carries no agent, so tauri.conf.json names
      # nothing under node_modules and compiling the bridge needs nothing
      # installed from the registry (#120).
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

      # What the crate pulls in, and under what licence. An advisory against a
      # transitive dependency is not something anybody notices by reading a
      # lockfile.
      - name: Dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: desktop/src-tauri/Cargo.toml
          command: check advisories licenses bans sources

  bundle:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
    # The one job that writes: tauri-action uploads the bundles and the
    # updater manifest to a release.
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The private key lives here and nowhere else. Whoever holds it can ship
      # code to every install, so it is not in the repository, not in
      # tauri.conf.json, and not in anybody's shell history.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: WorkRoom ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseDraft: false
          # The manifest the client checks. Without it the bundles exist and
          # nobody is told they do.
          includeUpdaterJson: true

  # The required check. See the note on `server-ci`. `bundle` is deliberately
  # not a dependency: it does not run on pull requests at all.
  desktop-ci:
    needs: [changes, check, bridge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "check: ${{ needs.check.result }}"
          echo "bridge: ${{ needs.bridge.result }}"
          # `changes` is in the list: a broken path filter must turn this red,
          # not skip the jobs behind it and count the silence as green (#173).
          for result in "${{ needs.changes.result }}" "${{ needs.check.result }}" "${{ needs.bridge.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
