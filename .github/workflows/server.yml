name: server

# The trigger is deliberately unfiltered while the work below is not. A path
# filter here means a pull request that touches only `desktop/**` never starts
# this workflow, and a required check that never starts is a pull request that
# can never merge.
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. See CONTRIBUTING.md for the pinning rule the `uses:`
# lines follow.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/server.yml'

  test:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          working-directory: server
          bundler-cache: false

      - run: bundle install --jobs 4

      # A style checker is not a security scanner, and both of these shipped
      # with Rails and had never been run.
      - name: Security
        run: bin/brakeman --no-pager --quiet

      - name: Gem advisories
        run: bundle exec bundler-audit check --update

      - name: Lint
        run: bin/rubocop --parallel

      - name: Prepare database
        run: bin/rails db:prepare

      # schema.rb cannot describe a row-level security policy, and the boundary
      # between workspaces is nothing but policies. Applied here so a database
      # loaded from the schema has one (#138).
      - name: Boundary
        run: bin/rails db:boundary

      - name: Test
        run: bin/rails test

  # This is the job branch protection requires, and the only one that runs
  # unconditionally. `skipped` passes: a pull request that leaves the server
  # alone has nothing to prove here. `failure` and `cancelled` do not.
  server-ci:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "test: ${{ needs.test.result }}"
          # `changes` is in the list: a broken path filter must turn this red,
          # not skip `test` and count the silence as green (#173).
          for result in "${{ needs.changes.result }}" "${{ needs.test.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
